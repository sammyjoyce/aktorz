name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  ZIG: python-zig

defaults:
  run:
    shell: bash

jobs:
  zig:
    name: Zig tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install Zig 0.16.0
        run: python -m pip install --disable-pip-version-check ziglang==0.16.0
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: python-zig build test
      - run: python-zig build sqlite-test

  node:
    name: Node ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install Zig 0.16.0
        run: python -m pip install --disable-pip-version-check ziglang==0.16.0
      - run: node --version
      - run: npm install
      - run: npm run build
      - run: npm run test:node
      - run: npm pack --ignore-scripts --dry-run

  bun:
    name: Bun bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install Zig 0.16.0
        run: python -m pip install --disable-pip-version-check ziglang==0.16.0
      - name: Install Bun
        run: npm install --global bun@1.3.14
      - run: npm install
      - run: npm run build
      - run: npm run test:bun

  package:
    name: Cross-platform package artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD
      - name: Install Zig 0.16.0
        run: python -m pip install --disable-pip-version-check ziglang==0.16.0
      - run: npm install
      - run: npm run build:typescript
      - run: npm run build:native:all
      - run: npm pack --ignore-scripts
